name: case-video-generator

x-app-environment: &app-environment
  CASE_VIDEO_REPO_ROOT: /app
  CASE_VIDEO_DEPLOYMENT_MODE: distributed
  CASE_VIDEO_DATABASE_URL: ${CASE_VIDEO_DATABASE_URL:?Set CASE_VIDEO_DATABASE_URL to a PostgreSQL psycopg URL}
  CASE_VIDEO_DATABASE_POOL_SIZE: ${CASE_VIDEO_DATABASE_POOL_SIZE:-10}
  CASE_VIDEO_REDIS_URL: redis://redis:6379/0
  CASE_VIDEO_REDIS_NAMESPACE: ${CASE_VIDEO_REDIS_NAMESPACE:-case-video}
  CASE_VIDEO_RATE_LIMIT_BACKEND: redis
  CASE_VIDEO_API_RATE_LIMIT_PER_MINUTE: ${CASE_VIDEO_API_RATE_LIMIT_PER_MINUTE:-240}
  CASE_VIDEO_API_RATE_LIMIT_BURST: ${CASE_VIDEO_API_RATE_LIMIT_BURST:-40}
  CASE_VIDEO_MAX_UPLOAD_BYTES: ${CASE_VIDEO_MAX_UPLOAD_BYTES:-209715200}
  CASE_VIDEO_MAX_UPLOAD_FILES: ${CASE_VIDEO_MAX_UPLOAD_FILES:-25}
  CASE_VIDEO_DATA_ROOT: /data/jobs
  CASE_VIDEO_SEED_PROJECTS_ROOT: /data/seed
  CASE_VIDEO_WORKER_WORKSPACE_ROOT: /work/stages
  CASE_VIDEO_RENDER_WORKSPACE_ROOT: /work/renders
  CASE_VIDEO_RENDER_ENGINE_ROOT: /app/engine/remotion
  CASE_VIDEO_RENDER_ENGINE_DIGEST: ${CASE_VIDEO_RENDER_ENGINE_DIGEST:?Set the immutable Remotion engine sha256 digest}
  CASE_VIDEO_OBJECT_STORE_BACKEND: minio
  CASE_VIDEO_OBJECT_STORE_ENDPOINT: http://minio:9000
  CASE_VIDEO_OBJECT_STORE_BUCKET: ${CASE_VIDEO_OBJECT_STORE_BUCKET:-case-video}
  CASE_VIDEO_OBJECT_STORE_REGION: ${CASE_VIDEO_OBJECT_STORE_REGION:-us-east-1}
  CASE_VIDEO_OBJECT_STORE_ACCESS_KEY_ENV: MINIO_ROOT_USER
  CASE_VIDEO_OBJECT_STORE_SECRET_KEY_ENV: MINIO_ROOT_PASSWORD
  CASE_VIDEO_OBJECT_STORE_SIGNING_SECRET_ENV: CASE_VIDEO_OBJECT_STORE_SIGNING_SECRET
  CASE_VIDEO_OBJECT_STORE_SIGNING_SECRET: ${CASE_VIDEO_OBJECT_STORE_SIGNING_SECRET:?Set a high-entropy object signing secret}
  MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
  MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
  CASE_VIDEO_AUTH_MODE: ${CASE_VIDEO_AUTH_MODE:-oidc}
  CASE_VIDEO_API_TOKEN: ${CASE_VIDEO_API_TOKEN:-}
  CASE_VIDEO_OIDC_ISSUER: ${CASE_VIDEO_OIDC_ISSUER:-}
  CASE_VIDEO_OIDC_AUDIENCE: ${CASE_VIDEO_OIDC_AUDIENCE:-}
  CASE_VIDEO_OIDC_JWKS_URL: ${CASE_VIDEO_OIDC_JWKS_URL:-}
  CASE_VIDEO_OIDC_ALGORITHMS: ${CASE_VIDEO_OIDC_ALGORITHMS:-RS256}
  CASE_VIDEO_OIDC_REQUIRE_NONCE: ${CASE_VIDEO_OIDC_REQUIRE_NONCE:-1}
  CASE_VIDEO_CORS_ORIGINS: ${CASE_VIDEO_CORS_ORIGINS:-}
  CASE_VIDEO_CSRF_TRUSTED_ORIGINS: ${CASE_VIDEO_CSRF_TRUSTED_ORIGINS:-}
  CASE_VIDEO_CSRF_ENABLED: ${CASE_VIDEO_CSRF_ENABLED:-1}
  CASE_VIDEO_DEFAULT_TENANT_ID: ${CASE_VIDEO_DEFAULT_TENANT_ID:-ten_default}
  CASE_VIDEO_DEFAULT_TENANT_NAME: ${CASE_VIDEO_DEFAULT_TENANT_NAME:-案例视频工作区}
  CASE_VIDEO_DEFAULT_USER_ID: ${CASE_VIDEO_DEFAULT_USER_ID:-usr_bootstrap}
  CASE_VIDEO_DEFAULT_ROLE: ${CASE_VIDEO_DEFAULT_ROLE:-admin}
  CASE_VIDEO_BOOTSTRAP_SUBJECT: ${CASE_VIDEO_BOOTSTRAP_SUBJECT:-bootstrap-admin}
  CASE_VIDEO_BOOTSTRAP_EMAIL: ${CASE_VIDEO_BOOTSTRAP_EMAIL:-}
  CASE_VIDEO_BOOTSTRAP_DISPLAY_NAME: ${CASE_VIDEO_BOOTSTRAP_DISPLAY_NAME:-平台管理员}
  CASE_VIDEO_UPLOAD_SCANNER: clamav
  CASE_VIDEO_CLAMD_HOST: clamav
  CASE_VIDEO_CLAMD_PORT: 3310
  CASE_VIDEO_REQUIRE_MODEL_CONFIG: 1
  CASE_VIDEO_DRY_RUN: ${CASE_VIDEO_DRY_RUN:-0}
  CASE_VIDEO_NARRATION_PROVIDER: azure_anthropic
  CASE_VIDEO_NARRATION_MODEL: case-video-claude
  CASE_VIDEO_REMOTION_PROVIDER: azure_anthropic
  CASE_VIDEO_REMOTION_MODEL: case-video-claude
  CASE_VIDEO_GENERAL_PROVIDER: openai
  CASE_VIDEO_GENERAL_MODEL: gpt-5.5
  CASE_VIDEO_GENERAL_REQUEST_MODEL: gpt-5.5
  CASE_VIDEO_GENERAL_AUTH_MODE: ${CASE_VIDEO_GENERAL_AUTH_MODE:-api-key}
  CASE_VIDEO_AZURE_ANTHROPIC_DEPLOYMENT: case-video-claude
  AZURE_ANTHROPIC_ENDPOINT: ${AZURE_ANTHROPIC_ENDPOINT:?Set the Azure Anthropic Messages API endpoint ending in /v1/messages}
  AZURE_ANTHROPIC_API_KEY: ${AZURE_ANTHROPIC_API_KEY:?Set AZURE_ANTHROPIC_API_KEY}
  AZURE_ANTHROPIC_VERSION: ${AZURE_ANTHROPIC_VERSION:-2023-06-01}
  AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:?Set the Azure OpenAI v1 endpoint ending in /openai/v1}
  AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:?Set AZURE_OPENAI_API_KEY}
  CASE_VIDEO_WORKER_HEARTBEAT_SECONDS: ${CASE_VIDEO_WORKER_HEARTBEAT_SECONDS:-15}
  CASE_VIDEO_WORKER_LEASE_SECONDS: ${CASE_VIDEO_WORKER_LEASE_SECONDS:-90}
  CASE_VIDEO_WORKER_MAX_ATTEMPTS: ${CASE_VIDEO_WORKER_MAX_ATTEMPTS:-3}
  CASE_VIDEO_MAINTENANCE_INTERVAL_SECONDS: ${CASE_VIDEO_MAINTENANCE_INTERVAL_SECONDS:-900}
  CASE_VIDEO_SUCCEEDED_RETENTION_DAYS: ${CASE_VIDEO_SUCCEEDED_RETENTION_DAYS:-90}
  CASE_VIDEO_FAILED_RETENTION_DAYS: ${CASE_VIDEO_FAILED_RETENTION_DAYS:-30}
  CASE_VIDEO_DELETION_RECOVERY_DAYS: ${CASE_VIDEO_DELETION_RECOVERY_DAYS:-7}
  CASE_VIDEO_AUDIT_RETENTION_DAYS: ${CASE_VIDEO_AUDIT_RETENTION_DAYS:-365}
  CASE_VIDEO_UPLOAD_TTL_SECONDS: ${CASE_VIDEO_UPLOAD_TTL_SECONDS:-86400}
  CASE_VIDEO_ORPHAN_TTL_SECONDS: ${CASE_VIDEO_ORPHAN_TTL_SECONDS:-86400}
  CASE_VIDEO_METRICS_ENABLED: 1
  CASE_VIDEO_STRUCTURED_LOGS: 1
  REMOTION_BROWSER_EXECUTABLE: /usr/bin/chromium
  REMOTION_CONCURRENCY: 1
  REMOTION_HARDWARE_ACCELERATION: disabled

x-app-service: &app-service
  image: ${CASE_VIDEO_IMAGE:-case-video-generator:local}
  build:
    context: .
    dockerfile: Dockerfile
  user: "10001:10001"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment:
    <<: *app-environment
  networks:
    - backend
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=1024m,uid=10001,gid=10001,mode=1770
  stop_grace_period: 60s

x-runtime-dependencies: &runtime-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully
  clamav:
    condition: service_healthy
  migration:
    condition: service_completed_successfully
  bootstrap:
    condition: service_completed_successfully
  queue-rebuild:
    condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casevideo}
      POSTGRES_USER: ${POSTGRES_USER:-casevideo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=256m
      - /var/run/postgresql:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 60s

  redis:
    image: redis:7-bookworm
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "60"
      - "1000"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 18
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      CASE_VIDEO_OBJECT_STORE_BUCKET: ${CASE_VIDEO_OBJECT_STORE_BUCKET:-case-video}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$CASE_VIDEO_OBJECT_STORE_BUCKET"
        mc version enable "local/$$CASE_VIDEO_OBJECT_STORE_BUCKET"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
      - /root/.mc:rw,nosuid,nodev,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  clamav:
    image: clamav/clamav:1.4
    platform: ${CASE_VIDEO_CLAMAV_PLATFORM:-linux/amd64}
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - backend
      - egress
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc 127.0.0.1 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  migration:
    <<: *app-service
    restart: "no"
    command: ["python", "-m", "server.app.persistence.migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  bootstrap:
    <<: *app-service
    restart: "no"
    command: ["python", "-m", "server.app.persistence.bootstrap"]
    depends_on:
      migration:
        condition: service_completed_successfully

  queue-rebuild:
    <<: *app-service
    restart: "no"
    command: ["python", "-m", "server.app.workers.control", "rebuild", "--once"]
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  api:
    <<: *app-service
    restart: unless-stopped
    command: ["uvicorn", "server.app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    ports:
      - "${CASE_VIDEO_BIND_ADDRESS:-127.0.0.1}:${CASE_VIDEO_HTTP_PORT:-8000}:8000"
    networks:
      - backend
      - egress
    depends_on: *runtime-dependencies
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      - api_data:/data/jobs

  dispatcher:
    <<: *app-service
    restart: unless-stopped
    command: ["python", "-m", "server.app.workers.control", "dispatch", "--interval", "0.5"]
    depends_on: *runtime-dependencies

  reaper:
    <<: *app-service
    restart: unless-stopped
    command: ["python", "-m", "server.app.workers.control", "reap", "--interval", "5"]
    depends_on: *runtime-dependencies

  maintenance:
    <<: *app-service
    restart: unless-stopped
    command: ["python", "-m", "server.app.workers.maintenance"]
    depends_on: *runtime-dependencies

  planning-worker:
    <<: *app-service
    restart: unless-stopped
    command: ["python", "-m", "server.app.workers.distributed", "planning"]
    depends_on: *runtime-dependencies
    volumes:
      - planning_workspace:/work/stages
    networks:
      - backend
      - egress

  media-worker:
    <<: *app-service
    restart: unless-stopped
    command: ["python", "-m", "server.app.workers.distributed", "media"]
    depends_on: *runtime-dependencies
    volumes:
      - media_workspace:/work/stages
    networks:
      - backend
      - egress

  render-worker-1:
    <<: *app-service
    restart: unless-stopped
    command: ["python", "-m", "server.app.workers.distributed", "render"]
    depends_on: *runtime-dependencies
    volumes:
      - render_stage_workspace_1:/work/stages
      - render_workspace_1:/work/renders
    shm_size: 2gb
    cpus: "4.0"
    mem_limit: 8g
    pids_limit: 1024

  render-worker-2:
    <<: *app-service
    profiles: ["render-ha"]
    restart: unless-stopped
    command: ["python", "-m", "server.app.workers.distributed", "render"]
    depends_on: *runtime-dependencies
    volumes:
      - render_stage_workspace_2:/work/stages
      - render_workspace_2:/work/renders
    shm_size: 2gb
    cpus: "4.0"
    mem_limit: 8g
    pids_limit: 1024

  render-worker-3:
    <<: *app-service
    profiles: ["render-ha"]
    restart: unless-stopped
    command: ["python", "-m", "server.app.workers.distributed", "render"]
    depends_on: *runtime-dependencies
    volumes:
      - render_stage_workspace_3:/work/stages
      - render_workspace_3:/work/renders
    shm_size: 2gb
    cpus: "4.0"
    mem_limit: 8g
    pids_limit: 1024

  qa-worker:
    <<: *app-service
    restart: unless-stopped
    command: ["python", "-m", "server.app.workers.distributed", "qa"]
    depends_on: *runtime-dependencies
    volumes:
      - qa_workspace:/work/stages

  operations-volume-init:
    image: alpine:3.21
    profiles: ["operations"]
    restart: "no"
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        chmod 0770 /backups /release-evidence
        chown 10001:10001 /backups /release-evidence
    volumes:
      - backup_data:/backups
      - release_evidence:/release-evidence
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true

  backup:
    <<: *app-service
    profiles: ["operations"]
    restart: "no"
    command: ["python", "-m", "server.app.operations.backup_cli", "create"]
    environment:
      <<: *app-environment
      CASE_VIDEO_BACKUP_DIRECTORY: ${CASE_VIDEO_BACKUP_DIRECTORY:-/backups/manual}
    depends_on:
      operations-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully
    volumes:
      - backup_data:/backups

  upgrade-capture:
    <<: *app-service
    profiles: ["operations"]
    restart: "no"
    command:
      - python
      - -m
      - server.app.operations.upgrade_cli
      - capture
      - /release-evidence/pre-upgrade.json
    depends_on:
      operations-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    volumes:
      - release_evidence:/release-evidence

  upgrade-verify:
    <<: *app-service
    profiles: ["operations"]
    restart: "no"
    command:
      - python
      - -m
      - server.app.operations.upgrade_cli
      - verify
      - /release-evidence/pre-upgrade.json
      - --report
      - /release-evidence/upgrade-verification.json
    depends_on:
      operations-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    volumes:
      - release_evidence:/release-evidence

  legacy-migration-dry-run:
    <<: *app-service
    profiles: ["operations"]
    restart: "no"
    command:
      - python
      - -m
      - server.app.persistence.import_legacy
      - /migration-source
      - --dry-run
      - --report
      - /release-evidence/migration-dry-run.json
    depends_on:
      operations-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${CASE_VIDEO_MIGRATION_SOURCE:-./data/jobs}
        target: /migration-source
        read_only: true
      - release_evidence:/release-evidence

  legacy-migration-import:
    <<: *app-service
    profiles: ["operations"]
    restart: "no"
    command:
      - python
      - -m
      - server.app.persistence.import_legacy
      - /migration-source
      - --report
      - /release-evidence/migration-import.json
    depends_on:
      operations-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${CASE_VIDEO_MIGRATION_SOURCE:-./data/jobs}
        target: /migration-source
        read_only: true
      - release_evidence:/release-evidence

  legacy-migration-shadow:
    <<: *app-service
    profiles: ["operations"]
    restart: "no"
    command:
      - python
      - -m
      - server.app.persistence.import_legacy
      - /migration-source
      - --shadow-only
      - --report
      - /release-evidence/migration-shadow.json
    depends_on:
      operations-volume-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migration:
        condition: service_completed_successfully
    volumes:
      - type: bind
        source: ${CASE_VIDEO_MIGRATION_SOURCE:-./data/jobs}
        target: /migration-source
        read_only: true
      - release_evidence:/release-evidence

networks:
  backend:
    internal: true
  egress:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
  api_data:
  planning_workspace:
  media_workspace:
  qa_workspace:
  render_stage_workspace_1:
  render_stage_workspace_2:
  render_stage_workspace_3:
  render_workspace_1:
  render_workspace_2:
  render_workspace_3:
  backup_data:
  release_evidence:
