<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d1826" />
    <meta
      name="description"
      content="Case Video Generator 女性领导力 100 · WL-003 视频预览"
    />
    <title>WL-003 · 她从不说“不”</title>
    <style>
      :root {
        color-scheme: dark;
        --ink: #07121f;
        --paper: #f6f0df;
        --red: #ca4d2a;
        --green: #59a55d;
        --yellow: #efdb56;
        --blue: #7d9dc6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        color: var(--paper);
        background:
          radial-gradient(circle at 12% 8%, rgba(202, 77, 42, 0.34), transparent 30rem),
          radial-gradient(circle at 88% 86%, rgba(89, 165, 93, 0.25), transparent 34rem),
          var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      main {
        width: min(1080px, calc(100% - 32px));
        margin: 0 auto;
        padding: 42px 0 64px;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        color: var(--ink);
        background: var(--yellow);
        border-radius: 999px;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      h1 {
        max-width: 760px;
        margin: 18px 0 10px;
        font-size: clamp(32px, 7vw, 72px);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }

      .lede {
        max-width: 680px;
        margin: 0 0 28px;
        color: rgba(246, 240, 223, 0.78);
        font-size: clamp(16px, 2.2vw, 20px);
        line-height: 1.7;
      }

      .player-shell {
        display: grid;
        place-items: center;
        padding: 18px;
        background: linear-gradient(135deg, rgba(246, 240, 223, 0.12), rgba(125, 157, 198, 0.08));
        border: 1px solid rgba(246, 240, 223, 0.18);
        border-radius: 24px;
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.32);
      }

      video {
        display: block;
        width: min(100%, 540px);
        max-height: 78vh;
        background: #000;
        border-radius: 14px;
        box-shadow: 0 12px 36px rgba(0, 0, 0, 0.42);
      }

      .meta {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 18px;
      }

      .meta-card {
        padding: 16px;
        color: var(--ink);
        background: var(--paper);
        border-radius: 14px;
      }

      .meta-card strong {
        display: block;
        margin-bottom: 5px;
        color: var(--red);
        font-size: 20px;
      }

      .meta-card span {
        color: rgba(7, 18, 31, 0.7);
        font-size: 13px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      a {
        color: inherit;
      }

      .button {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        border-radius: 999px;
        font-weight: 700;
        text-decoration: none;
      }

      .button-primary {
        color: var(--ink);
        background: var(--yellow);
      }

      .button-secondary {
        color: var(--paper);
        border: 1px solid rgba(246, 240, 223, 0.28);
      }

      footer {
        margin-top: 42px;
        color: rgba(246, 240, 223, 0.56);
        font-size: 13px;
        line-height: 1.7;
      }

      @media (max-width: 640px) {
        main {
          width: min(100% - 20px, 540px);
          padding-top: 24px;
        }

        .player-shell {
          padding: 8px;
          border-radius: 18px;
        }

        .meta {
          grid-template-columns: 1fr;
        }

        video {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="eyebrow">CASE VIDEO GENERATOR · WL-003</span>
      <h1>她从不说“不”，直到当众放错数据</h1>
      <p class="lede">
        女性领导力 100 系列公开示例。点击播放即可在线观看，也可以下载高清 Release 版本。
      </p>

      <section class="player-shell" aria-label="WL-003 视频播放器">
        <video controls playsinline preload="metadata" poster="poster.jpg">
          <source src="wl003-5m.mp4" type="video/mp4" />
          你的浏览器不支持 HTML5 视频，请直接下载
          <a href="wl003-5m.mp4">5MB 预览版</a>。
        </video>
      </section>

      <section class="meta" aria-label="视频信息">
        <div class="meta-card"><strong>02:22</strong><span>视频时长</span></div>
        <div class="meta-card"><strong>540 × 960</strong><span>在线预览画布</span></div>
        <div class="meta-card"><strong>约 4.7 MiB</strong><span>轻量预览文件</span></div>
      </section>

      <div class="actions">
        <a class="button button-primary" href="wl003-5m.mp4" download>下载 5MB 预览版</a>
        <a class="button button-secondary" href="https://github.com/billbai-longarena/caseVideoGenerator/releases/tag/demo-wl003">下载高清 Release 版</a>
        <a class="button button-secondary" href="https://github.com/billbai-longarena/caseVideoGenerator">查看项目源码</a>
      </div>

      <footer>
        预览版为网页播放优化版本；高清原片保留在 GitHub Release。项目代码与生产工具按 MIT License 发布，视频内容及第三方素材的权利不随代码许可证转移。
      </footer>
    </main>
  </body>
</html>
