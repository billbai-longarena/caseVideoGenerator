global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: case-video-api
    scheme: http
    metrics_path: /internal/metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/case_video_metrics_token
    static_configs:
      - targets:
          - api:8000

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
